[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-wiki-rag-demo"
version = "0.1.0"
description = "A compact but complete document ingestion and RAG demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.5",
  "charset-normalizer>=3.3",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "jieba>=0.42",
]

[project.optional-dependencies]
langfuse = ["langfuse==4.16.0"]
rerank = ["sentence-transformers>=3.0", "FlagEmbedding>=1.2"]
ocr = ["Pillow>=10", "pytesseract>=0.3.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
production = [
  "SQLAlchemy>=2.0",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "redis>=5.2",
  "qdrant-client>=1.12",
  "miniopy-async>=1.21",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "frontend*", "samples*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = "data/cache/pytest"
